
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Character Card</title>

    <meta name="description" content="Meet Snortleblat, a fantasy character with unique stats and abilities.">

    <!-- Open Graph Meta Tags -->
    <meta property="og:type" content="website">
    <meta property="og:title" content="Snortleblat Character Card">
    <meta property="og:description" content="Meet Snortleblat and explore his character stats.">
    <meta property="og:image" content="https://jacenhaws.github.io/wdd131/prove/snortleblat.webp">
    <meta property="og:url" content="https://jacenhaws.github.io/wdd131/prove/prove_wk8.html">

    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Snortleblat Character Card">
    <meta name="twitter:description" content="Meet Snortleblat!">
    <meta name="twitter:image" content="https://jacenhaws.github.io/wdd131/prove/snortleblat.webp">

    <link rel="icon" href="snortleblat.webp">
    <link rel="apple-touch-icon" href="images/apple-touch-icon.png">

    <link rel="stylesheet" href="charactercard.css">

    <script src="charactercard.js" defer></script>
</head>

<body>

    <main>
        <section class="card">

            <img
                class="image"
                src="snortleblat.webp"
                alt="Portrait of Snortleblat"
            >

            <h1 class="name" id="characterName">Character Name</h1>

            <div class="stats">
                <p>Class: <span id="characterClass"></span></p>

                <p>Level: <span id="characterLevel"></span></p>

                <p>Health: <span id="characterHealth"></span></p>
            </div>

            <div class="buttons">
                <button id="attackButton" type="button">
                    Attack
                </button>

                <button id="levelUpButton" type="button">
                    Level Up
                </button>
            </div>

            <p id="message" aria-live="polite"></p>

        </section>
    </main>

</body>
</html>
